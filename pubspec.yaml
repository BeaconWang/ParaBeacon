name: parabeacon
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.1.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Cross-platform low-latency audio engine for the real-time Vario audio
  # module (lib/audio/vario_audio_service.dart). flutter_miniaudio is an FFI
  # wrapper around miniaudio using WASAPI (Windows) / AAudio (Android) /
  # CoreAudio (macOS/iOS) / ALSA (Linux). It exposes a lock-free Int16 FIFO with
  # bufferLatency-based flow control, giving true low-latency PCM output with no
  # backlog. We synthesize 16-bit PCM in pure Dart and write() it directly.
  #
  # VENDORED into third_party/ (from github.com/bill0015/flutter_miniaudio) with
  # two Windows build fixes baked in so they persist across `flutter pub get`:
  #   1. src/CMakeLists.txt: only apply -Wall/-O2 for GCC/Clang (MSVC /O2 clashes
  #      with Debug /RTC1 -> error D8016).
  #   2. src/miniaudio_bridge.c: portable memory barrier (MSVC lacks
  #      __sync_synchronize -> LNK2019).
  flutter_miniaudio:
    path: third_party/flutter_miniaudio

  # Native memory helpers (malloc/free, Utf8) for the miniaudio FFI buffer.
  ffi: ^2.1.0

  # Bluetooth Low Energy (mobile only – iOS/Android). All calls into this
  # package are guarded by platform checks so the app still compiles and runs
  # on desktop (Windows/Linux/macOS) where BLE is not wired up.
  flutter_blue_plus: ^1.35.5

  # Runtime permission requests for BLE scanning/connecting on mobile.
  permission_handler: ^11.3.1

  # Persist the selected sensor so it can auto-reconnect on next launch.
  shared_preferences: ^2.3.2

  # Interactive slippy-map for the Map control (lib/controls/map_control.dart).
  # flutter_map renders raster tiles (OSM by default) with pan/zoom; latlong2
  # provides the LatLng type it consumes.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Device GPS for the Map control: streams the real position/heading and
  # handles the location-permission request on Android/iOS. On desktop it
  # degrades gracefully (the map falls back to the flight-data position).
  geolocator: ^13.0.2

  # Offline raster basemaps for the Map control: read .mbtiles files and feed
  # their tiles to flutter_map (used when the user activates an offline source
  # in the Map control settings). `mbtiles` is the reader; `flutter_map_mbtiles`
  # bridges it to flutter_map's TileProvider.
  flutter_map_mbtiles: ^1.0.4
  mbtiles: ^0.4.2

  # Resolve the app documents directory that holds imported .mbtiles files.
  path_provider: ^2.1.4
  path: ^1.9.0

  # Keep the screen awake while the app is in the foreground (a flight
  # instrument must stay visible); also helps keep work alive when backgrounded.
  wakelock_plus: ^1.2.8

  # Flights feature — export / import / reporting.
  # share_plus: share exported files (GPX / IGC / PDF / .pbflights) via the
  #   platform share sheet. archive: zip the whole flight library into a single
  #   .pbflights bundle (and read it back). pdf + printing: render a per-flight
  #   PDF report. crypto: SHA-256 "G-record" signature appended to exported IGC
  #   files. file_picker: pick a .pbflights bundle to import.
  share_plus: ^10.1.2
  archive: ^3.6.1
  pdf: ^3.11.1
  printing: ^5.13.3
  crypto: ^3.0.5
  file_picker: ^8.1.4

  # Save a rendered PNG "share card" to the device photo gallery.
  gal: ^2.3.0

  # Reverse-geocode takeoff/landing coordinates to place names via the AMap
  # (AutoNavi) web service. Only ever calls the fixed external host
  # `restapi.amap.com`; no internal-network requests are made.
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Generates native app icons (Android/iOS/Web/Windows/macOS) from a single
  # 1024x1024 source image. Run: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# App icon configuration for flutter_launcher_icons.
# Source image: assets/icon/app_icon.png (1024x1024, full-bleed).
flutter_launcher_icons:
  android: true
  adaptive_icon_background: "#030C26"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#0B1220"
    theme_color: "#0B1220"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
